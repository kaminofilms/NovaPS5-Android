name: Import verified Nova PS5 source

on:
  push:
    branches: [source-import]
    paths: ['.recovery/manifest.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and restore complete source snapshot
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,os,subprocess,tempfile,zipfile
          from pathlib import Path
          manifest=json.loads(Path('.recovery/manifest.json').read_text())
          assert len(list(Path('.recovery/parts').glob('*.bin')))==manifest['parts']
          archive=Path(tempfile.gettempdir())/'nova-verified-source.zip'
          with archive.open('wb') as out:
              for index in range(manifest['parts']):
                  out.write(Path(f'.recovery/parts/{index:04d}.bin').read_bytes())
          assert archive.stat().st_size==manifest['archiveBytes']
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==manifest['archiveSha256']
          subprocess.run(['git','fetch','origin','main'],check=True)
          base=subprocess.check_output(['git','rev-parse','origin/main'],text=True).strip()
          subprocess.run(['git','rm','-r','--ignore-unmatch','.'],check=True,stdout=subprocess.DEVNULL)
          with zipfile.ZipFile(archive) as z:
              expected={'NovaPs5/'+entry['path'] for entry in manifest['files']}
              assert set(z.namelist())==expected, 'Archive file set differs from tracked source'
              for entry in manifest['files']:
                  path=Path(entry['path'])
                  assert not path.is_absolute() and '..' not in path.parts
                  assert not str(path).lower().endswith(('.keystore','.jks','.p12','.pfx','.pup'))
                  content=z.read('NovaPs5/'+entry['path'])
                  digest=hashlib.sha1(b'blob '+str(len(content)).encode()+b'\0'+content).hexdigest()
                  assert digest==entry['sha'], entry['path']
                  path.parent.mkdir(parents=True,exist_ok=True)
                  path.write_bytes(content)
                  path.chmod(0o755 if entry['mode']=='100755' else 0o644)
          subprocess.run(['git','add','-A'],check=True)
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree==manifest['sourceTree'], 'Restored Git tree differs from original source'
          subprocess.run(['git','config','user.name','Nova PS5 Source Recovery'],check=True)
          subprocess.run(['git','config','user.email','actions@users.noreply.github.com'],check=True)
          message='Preserve complete NovaPs5 0.2.2 source snapshot\n\nOriginal local commit: '+manifest['sourceCommit']+'\nVerified source tree: '+tree+'\n'
          commit=subprocess.check_output(['git','commit-tree',tree,'-p',base],input=message,text=True).strip()
          subprocess.run(['git','push','origin',commit+':refs/heads/main'],check=True)
          print('Verified complete source imported: '+commit)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('Complete source imported: `'+commit+'`\n\nOriginal tree: `'+tree+'`\n\nFiles: '+str(len(manifest['files']))+'\n')
          PY
