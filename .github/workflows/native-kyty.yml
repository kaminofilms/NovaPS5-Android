name: Nova PS5 native ARM64 Kyty (embedded FEXCore)
# Native AArch64 Kyty linked with libnovafex.so; only guest code is translated.
# Builds on a Linux ARM64 runner, boots the legal ccleste homebrew under Xvfb/lavapipe and
# commits logs to lab-logs (runs/native-*). The packaged core is uploaded as an artifact.
on:
  push:
    branches: [native-arm64]
    paths: ['native/**', 'patches/**', 'tools/lab/**', 'tools/ci/**', 'tests/test_host_launch.py', 'droid-runtime/app/src/main/assets/engine/host-launch.sh', '.github/workflows/native-kyty.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: native-kyty-${{ github.ref }}
  cancel-in-progress: true
env:
  FEX_COMMIT: 14c92681f4d62cf84d901460e0358de09c8847a7
  KYTY_COMMIT: df5b9b92be7dfd463b47756b707d6d356a9f0550
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld ninja-build cmake git glslang-tools python3 pkg-config ccache \
            libgl1-mesa-dev libx11-dev libxcursor-dev libxext-dev libxfixes-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libwayland-dev wayland-protocols \
            libvulkan1 mesa-vulkan-drivers vulkan-tools xvfb imagemagick unzip patchelf mksh
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: native-ccache-${{ env.FEX_COMMIT }}-${{ hashFiles('native/**', 'patches/*') }}
          restore-keys: native-ccache-${{ env.FEX_COMMIT }}-
      - name: Build native AArch64 Kyty (libnovafex + Kyty + bundled runtime)
        run: |
          set -euo pipefail
          mkdir -p out
          bash tools/ci/build-native-kyty.sh "$PWD" "$PWD/work" "$PWD/dist" 2>&1 | tail -120
          cp -r dist/logs/. out/
      - name: Package core
        run: |
          mkdir -p dist/native-kyty && cp dist/native/* dist/native-core.json dist/native-kyty/
      - uses: actions/upload-artifact@v4
        with:
          name: native-kyty-arm64
          path: dist/native-kyty
          retention-days: 14
      - name: Boot ccleste (native ARM64 Kyty, lavapipe)
        env:
          NOVA_RELAXED_VULKAN: '1'
          NOVA_HOST_VA_BITS: '39'
        run: |
          set -uo pipefail
          mkdir -p build
          git fetch -q --depth 1 origin lab-assets
          git show origin/lab-assets:ccleste-PPSA59322.zip > build/ccleste.zip
          (cd build && unzip -q ccleste.zip)
          export VK_DRIVER_FILES="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          mkdir -p out/boot/cwd && cd out/boot/cwd
          bash "$GITHUB_WORKSPACE/tools/lab/run-kyty-lab.sh" native "$GITHUB_WORKSPACE/dist/ci/kyty_emulator" "$GITHUB_WORKSPACE/build/PPSA59322" "$GITHUB_WORKSPACE/out/boot" 300
          tail -80 "$GITHUB_WORKSPACE/out/boot/kyty.txt"
      - name: Host launch path (outside proot, mksh) unit test
        run: NOVA_TEST_SHELL=$(command -v mksh) python3 tests/test_host_launch.py
      - name: Boot ccleste through the host launch path (lavapipe)
        env:
          NOVA_RELAXED_VULKAN: '1'
          NOVA_HOST_VA_BITS: '39'
        run: |
          export VK_DRIVER_FILES="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          bash tools/lab/host-launch-boot.sh "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/dist/native" "$GITHUB_WORKSPACE/build/PPSA59322" "$GITHUB_WORKSPACE/out/hostboot" 90
      - name: Commit logs to lab-logs
        if: always()
        run: |
          cp -r dist/logs/. out/ 2>/dev/null || true
          set -euo pipefail
          dest="runs/native-${GITHUB_RUN_ID}-${GITHUB_SHA::8}"
          git init -q logs && cd logs
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin lab-logs; then git checkout -q -b lab-logs FETCH_HEAD; else git checkout -q --orphan lab-logs; fi
          mkdir -p "$dest"; cp -r ../out/. "$dest/" 2>/dev/null || true
          find "$dest" -type f -size +20M -delete
          printf '%s native job=%s\n' "$dest" "${{ job.status }}" >> INDEX.txt
          git add -A
          git -c user.name=nova-lab -c user.email=nova-lab@users.noreply.github.com commit -qm "native logs $dest"
          for i in 1 2 3; do git push -q origin HEAD:lab-logs && break; git pull -q --rebase origin lab-logs; done
