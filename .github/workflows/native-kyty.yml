name: Nova PS5 native ARM64 Kyty (embedded FEXCore)
# Native AArch64 Kyty linked with libnovafex.so; only guest code is translated.
# Builds on a Linux ARM64 runner, boots the legal ccleste homebrew under Xvfb/lavapipe and
# commits logs to lab-logs (runs/native-*). The packaged core is uploaded as an artifact.
on:
  push:
    branches: [native-arm64]
    paths: ['native/**', 'patches/**', 'tools/lab/**', '.github/workflows/native-kyty.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: native-kyty-${{ github.ref }}
  cancel-in-progress: true
env:
  FEX_COMMIT: 14c92681f4d62cf84d901460e0358de09c8847a7
  KYTY_COMMIT: df5b9b92be7dfd463b47756b707d6d356a9f0550
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld ninja-build cmake git glslang-tools python3 pkg-config ccache \
            libgl1-mesa-dev libx11-dev libxcursor-dev libxext-dev libxfixes-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libwayland-dev wayland-protocols \
            libvulkan1 mesa-vulkan-drivers vulkan-tools xvfb imagemagick unzip patchelf
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: native-ccache-${{ env.FEX_COMMIT }}-${{ hashFiles('native/**', 'patches/*') }}
          restore-keys: native-ccache-${{ env.FEX_COMMIT }}-
      - name: Build libnovafex
        run: |
          set -euo pipefail
          mkdir -p out
          export CCACHE_DIR=~/.cache/ccache CCACHE_MAXSIZE=4G
          git init -q fex && cd fex
          git remote add origin https://github.com/FEX-Emu/FEX.git
          git fetch -q --depth 1 origin "$FEX_COMMIT" && git checkout -q FETCH_HEAD
          git submodule update --init --depth 1 External/fmt External/range-v3 External/rpmalloc \
            External/unordered_dense External/vixl External/xxhash External/jemalloc_glibc Source/Common/cpp-optparse
          cp -r "$GITHUB_WORKSPACE/native/novafex" Source/Tools/NovaFex
          echo 'add_subdirectory(NovaFex/)' >> Source/Tools/CMakeLists.txt
          cd ..
          cmake -S fex -B build/fex -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DENABLE_LTO=OFF -DBUILD_FEXCONFIG=OFF -DBUILD_TESTING=OFF -DBUILD_THUNKS=OFF \
            -DENABLE_JEMALLOC_GLIBC_ALLOC=OFF -DENABLE_CCACHE=OFF > out/fex-cmake.txt 2>&1
          cmake --build build/fex --target novafex novafex_test --parallel 4 > out/fex-build.txt 2>&1 || { tail -80 out/fex-build.txt; exit 1; }
          mkdir -p novafex-dist/include novafex-dist/lib
          cp native/novafex/novafex.h novafex-dist/include/
          cp "$(find build/fex -name libnovafex.so | head -n 1)" novafex-dist/lib/
          "$(find build/fex -type f -name novafex_test -perm /111 | head -n 1)" > out/novafex-test.txt 2>&1 || true
          tail -3 out/novafex-test.txt
      - name: Kyty source with Nova patches
        run: |
          set -euo pipefail
          git init -q kyty && cd kyty
          git remote add origin https://github.com/KytyPS5/KytyPS5.git
          git fetch -q --depth 1 origin "$KYTY_COMMIT" && git checkout -q FETCH_HEAD
          git submodule update --init --recursive --depth 1 -q
          for p in $(grep -v '^#' "$GITHUB_WORKSPACE/patches/linux-core.series") kyty-nova-arm64.patch; do
            git apply "$GITHUB_WORKSPACE/patches/$p" || { echo "patch failed: $p"; exit 1; }
          done
      - name: Build native ARM64 Kyty
        run: |
          set -uo pipefail
          export CCACHE_DIR=~/.cache/ccache CCACHE_MAXSIZE=4G
          cmake -S kyty -B build/kyty -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DKYTY_BUILD_LAUNCHER=OFF -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DNOVAFEX_DIR="$PWD/novafex-dist" > out/kyty-cmake.txt 2>&1 || { tail -60 out/kyty-cmake.txt; exit 1; }
          status=0
          cmake --build build/kyty --target kyty_emulator --parallel 4 -- -k 0 > out/kyty-build.txt 2>&1 || status=$?
          grep -E "error:|undefined reference|FAILED:" out/kyty-build.txt | head -300 > out/kyty-errors.txt || true
          ccache -s >> out/kyty-build.txt
          echo "build status $status"; head -80 out/kyty-errors.txt
          exit $status
      - name: Package core
        run: |
          set -euo pipefail
          mkdir -p dist/native-kyty
          cp "$(find build/kyty -type f -name kyty_emulator -perm /111 | head -n 1)" dist/native-kyty/
          cp novafex-dist/lib/libnovafex.so dist/native-kyty/
          patchelf --set-rpath '$ORIGIN' dist/native-kyty/kyty_emulator
          ldd dist/native-kyty/kyty_emulator | tee out/ldd.txt
          file dist/native-kyty/kyty_emulator | tee -a out/ldd.txt
          sha256sum dist/native-kyty/* | tee out/core-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: native-kyty-arm64
          path: dist/native-kyty
          retention-days: 14
      - name: Boot ccleste (native ARM64 Kyty, lavapipe)
        env:
          NOVA_RELAXED_VULKAN: '1'
          NOVA_HOST_VA_BITS: '39'
        run: |
          set -uo pipefail
          git fetch -q --depth 1 origin lab-assets
          git show origin/lab-assets:ccleste-PPSA59322.zip > build/ccleste.zip
          (cd build && unzip -q ccleste.zip)
          export VK_DRIVER_FILES="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          mkdir -p out/boot/cwd && cd out/boot/cwd
          bash "$GITHUB_WORKSPACE/tools/lab/run-kyty-lab.sh" native "$GITHUB_WORKSPACE/dist/native-kyty/kyty_emulator" "$GITHUB_WORKSPACE/build/PPSA59322" "$GITHUB_WORKSPACE/out/boot" 300
          tail -80 "$GITHUB_WORKSPACE/out/boot/kyty.txt"
      - name: Commit logs to lab-logs
        if: always()
        run: |
          set -euo pipefail
          dest="runs/native-${GITHUB_RUN_ID}-${GITHUB_SHA::8}"
          git init -q logs && cd logs
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin lab-logs; then git checkout -q -b lab-logs FETCH_HEAD; else git checkout -q --orphan lab-logs; fi
          mkdir -p "$dest"; cp -r ../out/. "$dest/" 2>/dev/null || true
          find "$dest" -type f -size +20M -delete
          printf '%s native job=%s\n' "$dest" "${{ job.status }}" >> INDEX.txt
          git add -A
          git -c user.name=nova-lab -c user.email=nova-lab@users.noreply.github.com commit -qm "native logs $dest"
          for i in 1 2 3; do git push -q origin HEAD:lab-logs && break; git pull -q --rebase origin lab-logs; done
