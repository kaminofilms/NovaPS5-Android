name: Nova PS5 Android ARM64

on:
  push:
    branches: [main, dev]
    tags: ['dev-v*']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: novaps5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK, NDK and CMake
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Install Windows headers for the memory bridge
        run: sudo apt-get update && sudo apt-get install -y mingw-w64-x86-64-dev
      - name: Check guest address-space bridge
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -I tests tests/test_memory_bridge.c -o "$RUNNER_TEMP/memory-tests"
          "$RUNNER_TEMP/memory-tests"
      - name: Check portable ELF and SELF parser
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I droid-runtime/app/src/main/cpp/novadiag tests/test_self.cpp droid-runtime/app/src/main/cpp/novadiag/probe.cpp -o "$RUNNER_TEMP/novaps5-self-check"
          "$RUNNER_TEMP/novaps5-self-check"
      - name: Check core import overlay and direct Kyty routing
        run: |
          python3 tests/test_core_overlay.py
          python3 tests/test_direct_launch.py
      - name: Resolve and verify pinned build dependencies
        run: |
          python3 build-runtime-apk.py --sdk "$ANDROID_HOME" --ndk "$ANDROID_HOME/ndk/28.2.13676358" --jdk "$JAVA_HOME" --keystore "$RUNNER_TEMP/novaps5-ci.keystore" --output dist/NovaPs5-0.2.4-bootapi-arm64.apk --verify-dependencies-only
      - name: Create temporary CI development identity
        run: keytool -genkeypair -storetype PKCS12 -keystore "$RUNNER_TEMP/novaps5-ci.keystore" -storepass android -keypass android -alias novaps5dev -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=NovaPs5 CI Development'
      - name: Compile Nova native and Java code and package ARM64 APK
        run: |
          python3 build-runtime-apk.py --sdk "$ANDROID_HOME" --ndk "$ANDROID_HOME/ndk/28.2.13676358" --jdk "$JAVA_HOME" --keystore "$RUNNER_TEMP/novaps5-ci.keystore" --output dist/NovaPs5-0.2.4-bootapi-arm64.apk
      - name: Verify APK signing, architecture and runtime method access
        run: |
          python3 tests/verify_runtime_apk.py dist/NovaPs5-0.2.4-bootapi-arm64.apk --sdk "$ANDROID_HOME" --json-output dist/verification.json
          sha256sum dist/NovaPs5-0.2.4-bootapi-arm64.apk > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NovaPs5-Android-arm64-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/novaps5-ci.keystore"

  development-release:
    if: startsWith(github.ref, 'refs/tags/dev-v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: NovaPs5-Android-arm64-${{ github.sha }}
          path: release-files
      - name: Publish tagged development build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --prerelease --title "Nova PS5 $RELEASE_TAG" --notes-file docs/CI_RELEASE_NOTES.md release-files/*
