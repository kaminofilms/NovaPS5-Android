name: Nova PS5 Linux Kyty FEX Android APK
on:
  push:
    branches: [ps5-linux-core]
    paths:
      - 'build-runtime-apk.py'
      - 'runtime-linux/**'
      - 'droid-runtime/app/src/main/java/com/kaminofilms/novaps5/**'
      - 'droid-runtime/app/src/main/assets/engine/launch-linux.sh'
      - 'tests/verify_runtime_apk.py'
      - '.github/workflows/build-linux-runtime-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  linux-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - name: Retrieve pinned successful Linux core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/linux-core/dist
          gh run download 38324155342 --repo "$GITHUB_REPOSITORY" --name NovaPS5-Linux-Kyty-x86_64-802adeb479110a76b590a0f56747b41c049b3adb --dir build/linux-core/dist
          cd build/linux-core
          sha256sum -c dist/SHA256SUMS.txt
          echo 'e594d71bb9c60ff47d2ac1e1ee4b9c21eca7ad1ba949d1943a7644eabc2f846c  dist/kyty_emulator' | sha256sum -c -
          chmod 755 dist/kyty_emulator
          readelf -l dist/kyty_emulator > dist/program-headers.txt
          readelf -d dist/kyty_emulator > dist/dynamic-dependencies.txt
          timeout 30s dist/kyty_emulator --help | tee dist/cli-preflight.txt
      - name: Test Linux launch routing
        run: python3 tests/test_linux_launch.py
      - name: Provision pinned standalone FEX and x86-64 guest libraries
        run: python3 runtime-linux/provision.py --output droid-runtime/app/src/main/assets/engine/linux-runtime.tar.gz
      - name: Create CI signing identity
        run: keytool -genkeypair -storetype PKCS12 -keystore "$RUNNER_TEMP/novaps5-ci.keystore" -storepass android -keypass android -alias novaps5dev -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=NovaPs5 Linux FEX CI Development'
      - name: Build Linux FEX Android APK
        run: |
          python3 build-runtime-apk.py --sdk "$ANDROID_HOME" --ndk "$ANDROID_HOME/ndk/28.2.13676358" --jdk "$JAVA_HOME" --keystore "$RUNNER_TEMP/novaps5-ci.keystore" --output dist/NovaPS5-0.3.1-linux-fex-arm64.apk --linux-core build/linux-core/dist/kyty_emulator
      - name: Verify Linux APK
        run: |
          python3 tests/verify_runtime_apk.py dist/NovaPS5-0.3.1-linux-fex-arm64.apk --sdk "$ANDROID_HOME" --linux-core --json-output dist/verification.json
          sha256sum dist/NovaPS5-0.3.1-linux-fex-arm64.apk > dist/SHA256SUMS.txt
          cp build/linux-core/dist/cli-preflight.txt dist/linux-host-cli.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NovaPS5-Linux-FEX-APK-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/novaps5-ci.keystore"
  arm64-fex-preflight:
    needs: linux-apk
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: NovaPS5-Linux-FEX-APK-${{ github.sha }}
          path: dist
      - name: Run standalone FEX stages A through D on Linux ARM64
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile,tarfile,io
          from pathlib import Path
          with zipfile.ZipFile('dist/NovaPS5-0.3.1-linux-fex-arm64.apk') as apk:
              Path('build').mkdir(exist_ok=True)
              Path('build/kyty_emulator').write_bytes(apk.read('assets/engine/kyty_emulator'))
              Path('build/fex-linux.sh').write_bytes(apk.read('assets/engine/fex-linux.sh'))
              with tarfile.open(fileobj=io.BytesIO(apk.read('assets/engine/linux-runtime.tar.gz')),mode='r:gz') as runtime:
                  runtime.extractall('build/runtime',filter='data')
          PY
          chmod 755 build/kyty_emulator
          source build/fex-linux.sh
          nova_fex_setup "$PWD/build/runtime" "$PWD/build/fex-config"
          export -f nova_fex_run
          export nova_fex nova_loader nova_guest_libs
          {
            echo 'CI host: ARM64 Linux; Android/Adreno hardware unavailable'
            timeout 30s FEXGetConfig --version
            timeout 60s bash -c 'nova_fex_run "$@"' nova "$PWD/build/runtime/guest/nova-probe"
            timeout 60s bash -c 'nova_fex_run "$@"' nova --list "$PWD/build/kyty_emulator"
            timeout 60s bash -c 'nova_fex_run "$@"' nova "$PWD/build/kyty_emulator" --help
            timeout 60s bash -c 'nova_fex_run "$@"' nova "$PWD/build/runtime/guest/nova-probe" --memory
          } 2>&1 | tee dist/arm64-fex-preflight.txt
      - name: Verify Vulkan thunk using the ARM64 software ICD
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers
          source build/fex-linux.sh
          nova_fex_setup "$PWD/build/runtime" "$PWD/build/fex-config"
          export -f nova_fex_run
          export nova_fex nova_loader nova_guest_libs
          export VK_DRIVER_FILES="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          test -n "$VK_DRIVER_FILES" && test -r "$VK_DRIVER_FILES" || { echo 'Software Vulkan ICD missing'; ls -l /usr/share/vulkan/icd.d; exit 1; }
          echo "Software ICD: $VK_DRIVER_FILES"
          cat "$VK_DRIVER_FILES"
          echo 'CI Vulkan uses software rendering; no Adreno or presented game frame claim' | tee -a dist/arm64-fex-preflight.txt
          timeout 90s bash -c 'nova_fex_run "$@"' nova "$PWD/build/runtime/guest/nova-probe" --vulkan 2>&1 | tee -a dist/arm64-fex-preflight.txt
      - name: Verify the identical loader wrapper inside pinned DroidDeck rootfs and proot
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends proot zstd
          curl --fail --location --retry 3 --silent --show-error https://github.com/The412Banner/winlator-contents/releases/download/linuxfs-r9/linuxfs.tar.zst -o build/linuxfs.tar.zst
          echo 'd3240c1531531615b0dd06b6ad56e92db9015a8641eb18c3a613835ae45992e7  build/linuxfs.tar.zst' | sha256sum -c -
          mkdir -p build/droid-root
          tar --zstd -xf build/linuxfs.tar.zst -C build/droid-root
          rm build/linuxfs.tar.zst
          mkdir -p build/droid-root/opt/novaps5/linux-kyty build/droid-root/opt/novaps5/linux-runtime
          cp build/fex-linux.sh build/droid-root/opt/novaps5/fex-linux.sh
          # Reproduce a global ARM64 preload; the x86-64 guest must mask it.
          echo /usr/lib/libm.so.6 > build/droid-root/etc/ld.so.preload
          cat > build/droid-root/opt/novaps5/ci-preflight.sh <<'SH'
          set -euo pipefail
          source /opt/novaps5/fex-linux.sh
          nova_fex_setup /opt/novaps5/linux-runtime /opt/novaps5/fex-config
          FEXGetConfig --version
          nova_fex_run /opt/novaps5/linux-runtime/guest/nova-probe
          nova_fex_run --list /opt/novaps5/linux-kyty/kyty_emulator
          nova_fex_run /opt/novaps5/linux-kyty/kyty_emulator --help
          echo 'NOVA_PROOT: probe, dependency resolution and Kyty CLI PASS inside DroidDeck linuxfs-r9'
          SH
          timeout 180s proot -0 -r "$PWD/build/droid-root" -b /dev -b /proc -b /sys -b "$PWD/build/runtime:/opt/novaps5/linux-runtime" -b "$PWD/build/kyty_emulator:/opt/novaps5/linux-kyty/kyty_emulator" -w /opt/novaps5 /bin/bash /opt/novaps5/ci-preflight.sh 2>&1 | tee -a dist/arm64-fex-preflight.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NovaPS5-Linux-FEX-Preflight-${{ github.sha }}
          path: dist/arm64-fex-preflight.txt
          if-no-files-found: warn
          retention-days: 30

