name: Nova PS5 Linux Kyty FEX Android APK
on:
  push:
    branches: [ps5-linux-core, native-arm64]
    paths:
      - 'build-runtime-apk.py'
      - 'runtime-linux/**'
      - 'patches/**'
      - 'droid-runtime/app/src/main/java/com/kaminofilms/novaps5/**'
      - 'droid-runtime/app/src/main/assets/engine/**'
      - 'tests/**'
      - 'tools/ci/**'
      - 'native/**'
      - '.github/workflows/build-linux-runtime-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
env:
  APK: NovaPS5-0.4.10-native-arm64.apk
  KYTY_COMMIT: df5b9b92be7dfd463b47756b707d6d356a9f0550
jobs:
  core:
    name: Build Linux x86-64 Kyty (pinned source + Nova patches)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install headless Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld ninja-build cmake git glslang-tools python3 pkg-config ccache libgl1-mesa-dev libx11-dev libxcursor-dev libxext-dev libxfixes-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev libxkbcommon-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libwayland-dev wayland-protocols
      - uses: actions/checkout@v4
        with:
          repository: KytyPS5/KytyPS5
          ref: ${{ env.KYTY_COMMIT }}
          submodules: recursive
          path: linux-kyty
      - name: Apply Nova Kyty patches
        run: grep -v '^#' patches/linux-core.series | while read -r p; do echo "apply $p"; git -C linux-kyty apply --verbose "$GITHUB_WORKSPACE/patches/$p"; done
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: kyty-ccache-df5b9b9-${{ hashFiles('patches/linux-core.series', 'patches/*.patch') }}
          restore-keys: kyty-ccache-df5b9b9-
      - name: Build
        run: |
          set -euo pipefail
          export CCACHE_DIR=~/.cache/ccache CCACHE_MAXSIZE=2G
          cmake -S linux-kyty -B build/linux-kyty -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DKYTY_BUILD_LAUNCHER=OFF -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build/linux-kyty --target kyty_emulator --parallel 4
          mkdir -p core
          cp "$(find build/linux-kyty -type f -name kyty_emulator -perm /111 | head -n 1)" core/kyty_emulator
          file core/kyty_emulator | grep -q 'ELF 64-bit.*x86-64'
          timeout 30s core/kyty_emulator --help > core/cli-preflight.txt
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          h=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          json.dump({'sha256':h('core/kyty_emulator'),'source_commit':'${{ env.KYTY_COMMIT }}',
                     'patches':{n:h('patches/'+n) for n in Path('patches/linux-core.series').read_text().split() if not n.startswith('#') and n.endswith('.patch')}},
                    open('core/kyty-core.json','w'),indent=2)
          print(open('core/kyty-core.json').read())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kyty-linux-core
          path: core/*
          retention-days: 30
  native-core:
    name: Build native AArch64 Kyty (embedded FEXCore)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld ninja-build cmake git glslang-tools python3 pkg-config ccache patchelf \
            libgl1-mesa-dev libx11-dev libxcursor-dev libxext-dev libxfixes-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libwayland-dev wayland-protocols
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: native-ccache-${{ hashFiles('native/**', 'patches/*') }}
          restore-keys: native-ccache-
      - name: Build
        run: |
          set -euo pipefail
          bash tools/ci/build-native-kyty.sh "$PWD" "$PWD/work" "$PWD/dist" 2>&1 | tail -120
      - uses: actions/upload-artifact@v4
        with:
          name: kyty-native-core
          path: |
            dist/native
            dist/native-core.json
          retention-days: 30
  linux-apk:
    needs: [core, native-core]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android build tools and Vulkan headers
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libvulkan-dev
      - uses: actions/download-artifact@v4
        with:
          name: kyty-linux-core
          path: build/linux-core
      - uses: actions/download-artifact@v4
        with:
          name: kyty-native-core
          path: build/native-core
      - name: Test Linux launch routing
        run: python3 tests/test_linux_launch.py
      - name: Provision pinned standalone FEX and x86-64 guest libraries
        run: |
          set -euo pipefail
          chmod 755 build/linux-core/kyty_emulator
          sha=$(python3 -c "import json;print(json.load(open('build/linux-core/kyty-core.json'))['sha256'])")
          python3 runtime-linux/provision.py --core-sha "$sha" --native-dir build/native-core/native --output droid-runtime/app/src/main/assets/engine/linux-runtime.tar.gz
      - name: Signing identity (repository secret NOVA_KEYSTORE_B64 keeps upgrades installable)
        env:
          NOVA_KEYSTORE_B64: ${{ secrets.NOVA_KEYSTORE_B64 }}
        run: |
          if [ -n "$NOVA_KEYSTORE_B64" ]; then echo "$NOVA_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/novaps5-ci.keystore"; echo 'Using persistent signing key';
          else cp tools/ci/novaps5-ci-test.keystore "$RUNNER_TEMP/novaps5-ci.keystore"; echo 'Using the committed CI test key (private repository): CI builds update each other in place'; fi
      - name: Build Linux FEX Android APK
        run: python3 build-runtime-apk.py --sdk "$ANDROID_HOME" --ndk "$ANDROID_HOME/ndk/28.2.13676358" --jdk "$JAVA_HOME" --keystore "$RUNNER_TEMP/novaps5-ci.keystore" --output "dist/$APK" --linux-core build/linux-core/kyty_emulator
      - name: Verify Linux APK
        run: |
          set -o pipefail
          python3 tests/verify_runtime_apk.py "dist/$APK" --sdk "$ANDROID_HOME" --linux-core --json-output dist/verification.json 2>&1 | tail -60 > dist/verify-output.txt || { cat dist/verify-output.txt; exit 1; }
          (cd dist && sha256sum "$APK" > SHA256SUMS.txt)
          cp build/linux-core/cli-preflight.txt dist/linux-host-cli.txt
          cp build/linux-core/kyty-core.json dist/kyty-core.json
          cp build/native-core/native-core.json dist/native-core.json
      - uses: actions/upload-artifact@v4
        with:
          name: NovaPS5-Linux-FEX-APK-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: apk-debug-${{ github.sha }}
          path: dist/verify-output.txt
          retention-days: 7
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/novaps5-ci.keystore"
  arm64-fex-preflight:
    needs: linux-apk
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: NovaPS5-Linux-FEX-APK-${{ github.sha }}
          path: dist
      - name: Unpack the APK payload exactly as Android receives it
        run: |
          python3 - <<'PY'
          import zipfile,tarfile,io,os
          from pathlib import Path
          with zipfile.ZipFile('dist/'+os.environ['APK']) as apk:
              Path('build').mkdir(exist_ok=True)
              Path('build/kyty_emulator').write_bytes(apk.read('assets/engine/kyty_emulator'))
              Path('build/fex-linux.sh').write_bytes(apk.read('assets/engine/fex-linux.sh'))
              with tarfile.open(fileobj=io.BytesIO(apk.read('assets/engine/linux-runtime.tar.gz')),mode='r:gz') as runtime:
                  runtime.extractall('build/runtime',filter='data')
          PY
          chmod 755 build/kyty_emulator
      - name: Stages B-C and E through standalone FEX on Linux ARM64
        shell: bash
        run: |
          set -euo pipefail
          source build/fex-linux.sh
          nova_fex_setup "$PWD/build/runtime" "$PWD/build/fex-config"
          export -f nova_fex_run
          export nova_fex nova_loader nova_guest_libs
          run() { timeout 60s bash -c 'nova_fex_run "$@"' nova "$@"; }
          {
            echo 'CI host: ARM64 Linux; Android/Adreno hardware unavailable'
            timeout 30s FEXGetConfig --version
            run "$PWD/build/runtime/guest/nova-probe"
            run --list "$PWD/build/kyty_emulator"
            run "$PWD/build/kyty_emulator" --help
            run "$PWD/build/runtime/guest/nova-probe" --memory
          } 2>&1 | tee dist/arm64-fex-preflight.txt
      - name: Stage D Vulkan translation through FEX thunks (ARM64 lavapipe)
        shell: bash
        run: |
          set -uo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers
          source build/fex-linux.sh
          nova_fex_setup "$PWD/build/runtime" "$PWD/build/fex-config"
          export VK_DRIVER_FILES="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          test -n "$VK_DRIVER_FILES" || { echo 'Software Vulkan ICD missing'; exit 1; }
          echo "CI Vulkan: $VK_DRIVER_FILES (software; no Adreno or presented-frame claim)" | tee -a dist/arm64-fex-preflight.txt
          status=0
          timeout 90s bash -c 'source build/fex-linux.sh; nova_fex_setup "$PWD/build/runtime" "$PWD/build/fex-config" >/dev/null; nova_fex_run "$PWD/build/runtime/guest/nova-probe" --vulkan' > build/vulkan.txt 2>&1 || status=$?
          cat build/vulkan.txt | tee -a dist/arm64-fex-preflight.txt
          # The guest loader must reach the ARM64 host driver through the thunk (not the x86 loader's empty ICD list).
          grep -q 'NOVA_VULKAN: vkEnumeratePhysicalDevices=0 devices=[1-9]' build/vulkan.txt
          grep -q 'NOVA_VULKAN: device 0: llvmpipe' build/vulkan.txt
          # lavapipe lacks barycentrics/minLod/depthBounds, so Kyty requirements are expected to FAIL (75) here.
          [[ $status -eq 0 || $status -eq 75 ]] || { echo "unexpected probe status $status"; exit 1; }
          echo "NOVA_CI: guest Vulkan reached the ARM64 host ICD through FEX thunks (probe status $status)" | tee -a dist/arm64-fex-preflight.txt
          # DroidDeck's proot does not translate openat2(), which FEX uses for thunk overlays and
          # RootFS lookups. Reproduce that with seccomp (openat2 -> ENOSYS): the guest must still
          # reach the host driver, because the guest libvulkan.so.1 is the thunk itself.
          gcc -O2 -o build/no-openat2 tools/ci/no-openat2.c
          status=0
          timeout 90s build/no-openat2 bash -c 'source build/fex-linux.sh; nova_fex_setup "$PWD/build/runtime" "$PWD/build/fex-config2" >/dev/null; nova_fex_run "$PWD/build/runtime/guest/nova-probe" --vulkan' > build/vulkan-noopenat2.txt 2>&1 || status=$?
          sed 's/^/[no-openat2] /' build/vulkan-noopenat2.txt | grep -v 'Linking address' | tee -a dist/arm64-fex-preflight.txt
          grep -q 'NOVA_VULKAN: vkEnumeratePhysicalDevices=0 devices=[1-9]' build/vulkan-noopenat2.txt
          echo "NOVA_CI: Vulkan thunk works without openat2 (proot conditions), probe status $status" | tee -a dist/arm64-fex-preflight.txt
      - name: Same wrapper inside the pinned DroidDeck rootfs under proot
        # Ubuntu's proot segfaults on this rootfs on GitHub's ARM64 runners (not DroidDeck's
        # proot); the openat2 behaviour that matters is covered by the seccomp test above.
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends proot zstd
          curl --fail --location --retry 3 --silent --show-error https://github.com/The412Banner/winlator-contents/releases/download/linuxfs-r9/linuxfs.tar.zst -o build/linuxfs.tar.zst
          echo 'd3240c1531531615b0dd06b6ad56e92db9015a8641eb18c3a613835ae45992e7  build/linuxfs.tar.zst' | sha256sum -c -
          mkdir -p build/droid-root
          tar --zstd -xf build/linuxfs.tar.zst -C build/droid-root
          rm build/linuxfs.tar.zst
          mkdir -p build/droid-root/opt/novaps5/linux-kyty build/droid-root/opt/novaps5/linux-runtime
          cp build/fex-linux.sh build/droid-root/opt/novaps5/fex-linux.sh
          echo /usr/lib/libm.so.6 > build/droid-root/etc/ld.so.preload
          cat > build/droid-root/opt/novaps5/ci-preflight.sh <<'SH'
          set -uo pipefail
          source /opt/novaps5/fex-linux.sh
          nova_fex_setup /opt/novaps5/linux-runtime /opt/novaps5/fex-config
          FEXGetConfig --version
          nova_fex_run /opt/novaps5/linux-runtime/guest/nova-probe || exit 1
          nova_fex_run --list /opt/novaps5/linux-kyty/kyty_emulator || exit 1
          nova_fex_run /opt/novaps5/linux-kyty/kyty_emulator --help || exit 1
          echo 'NOVA_PROOT: probe, dependency resolution and Kyty CLI PASS inside DroidDeck linuxfs-r9'
          echo "NOVA_PROOT: DroidDeck host Vulkan ICDs: $(ls /usr/share/vulkan/icd.d 2>/dev/null | tr '\n' ' ')"
          ldd /opt/novaps5/linux-runtime/host/usr/lib/aarch64-linux-gnu/fex-emu/HostThunks/libvulkan-host.so | grep -i 'not found' && echo 'NOVA_PROOT: host Vulkan thunk has unresolved deps' || echo 'NOVA_PROOT: host Vulkan thunk dependencies resolve in DroidDeck rootfs'
          for icd in /usr/share/vulkan/icd.d/*.json; do
            echo "--- guest probe with host ICD $icd (no GPU in CI; failure to open a device is expected for hardware ICDs)"
            VK_DRIVER_FILES=$icd timeout 90s bash -c 'source /opt/novaps5/fex-linux.sh; nova_fex_setup /opt/novaps5/linux-runtime /opt/novaps5/fex-config >/dev/null; nova_fex_run /opt/novaps5/linux-runtime/guest/nova-probe --vulkan' || echo "probe status $?"
          done
          SH
          timeout 600s proot -0 -r "$PWD/build/droid-root" -b /dev -b /proc -b /sys -b "$PWD/build/runtime:/opt/novaps5/linux-runtime" -b "$PWD/build/kyty_emulator:/opt/novaps5/linux-kyty/kyty_emulator" -w /opt/novaps5 /bin/bash /opt/novaps5/ci-preflight.sh 2>&1 | tee -a dist/arm64-fex-preflight.txt
          grep -q 'NOVA_PROOT: probe, dependency resolution and Kyty CLI PASS' dist/arm64-fex-preflight.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NovaPS5-Linux-FEX-Preflight-${{ github.sha }}
          path: dist/arm64-fex-preflight.txt
          if-no-files-found: warn
          retention-days: 30
  publish:
    # Artifacts need a GitHub login to download; a prerelease gives a plain link.
    needs: [linux-apk, arm64-fex-preflight]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NovaPS5-Linux-FEX-APK-${{ github.sha }}
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: NovaPS5-Linux-FEX-Preflight-${{ github.sha }}
          path: dist
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v0.4.10-native-${GITHUB_SHA::7}"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Nova PS5 0.4.10 native ARM64 Kyty (CI ${GITHUB_SHA::7}, device test build)" \
            --notes "CI-signed device test build. Kyty runs natively on ARM64 with an embedded FEXCore translating only game code (NOVA_ENGINE=fex selects the previous full-FEX path). PS5 game boot and frame presentation on Adreno are UNVERIFIED until tested on hardware. Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            "dist/$APK" dist/SHA256SUMS.txt dist/verification.json dist/kyty-core.json dist/native-core.json dist/arm64-fex-preflight.txt
  logs:
    # CI logs are also committed to the lab-logs branch so they can be read with plain git.
    needs: [core, linux-apk, arm64-fex-preflight]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: NovaPS5-Linux-FEX-Preflight-${{ github.sha }}
          path: out
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: NovaPS5-Linux-FEX-APK-${{ github.sha }}
          path: apk
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: apk-debug-${{ github.sha }}
          path: out
      - name: Commit logs to lab-logs
        run: |
          set -euo pipefail
          mkdir -p out
          cp apk/verification.json apk/SHA256SUMS.txt apk/kyty-core.json out/ 2>/dev/null || true
          dest="release/${GITHUB_RUN_ID}-${GITHUB_SHA::8}"
          git init -q logs && cd logs
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin lab-logs; then git checkout -q -b lab-logs FETCH_HEAD; else git checkout -q --orphan lab-logs; fi
          mkdir -p "$dest"; cp -r ../out/. "$dest/" || true
          printf '%s core=%s apk=%s arm64=%s\n' "$dest" "${{ needs.core.result }}" "${{ needs.linux-apk.result }}" "${{ needs.arm64-fex-preflight.result }}" >> INDEX.txt
          git add -A
          git -c user.name=nova-ci -c user.email=nova-ci@users.noreply.github.com commit -qm "release logs $dest"
          for i in 1 2 3; do git push -q origin HEAD:lab-logs && break; git pull -q --rebase origin lab-logs; done
