name: Nova Android guest core boot APIs

on:
  push:
    branches: [ps5-boot-api]
    paths:
      - 'vendor/kytyps5/**'
      - 'patches/pc-boot-api.patch'
      - 'tools/apply-pc-boot-api-overlay.py'
      - 'docs/ANDROID_BOOT_API.md'
      - '.github/workflows/build-pc-boot-api.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pc-boot-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guest-core:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: KytyPS5/KytyPS5
          ref: df5b9b92be7dfd463b47756b707d6d356a9f0550
          submodules: recursive
          path: pc-kyty
      - name: Apply pinned source overlay
        run: python tools/apply-pc-boot-api-overlay.py pc-kyty
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install pinned official glslang compiler
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'glslang-16.6.0-windows.zip'
          Invoke-WebRequest 'https://github.com/KhronosGroup/glslang/releases/download/16.6.0/glslang-16.6.0-windows-x86_64-release.zip' -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne '82bf434e69b9bb4829de7e2b4bc2c5e7a7861e53d66cf75e5cc70f5f694a8d9b') { throw 'glslang checksum mismatch' }
          $target = Join-Path $env:RUNNER_TEMP 'glslang-16.6.0'
          Expand-Archive $archive -DestinationPath $target
          $tool = Get-ChildItem $target -Recurse -File | Where-Object { $_.Name -in @('glslangValidator.exe', 'glslang.exe') } | Select-Object -First 1
          if (-not $tool) { throw 'glslang compiler missing from verified archive' }
          $tool.DirectoryName >> $env:GITHUB_PATH
          & $tool.FullName --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Configure full core without Qt launcher
        shell: cmd
        env:
          SCCACHE_GHA_ENABLED: 'true'
        run: |
          cmake -S pc-kyty -B pc-build -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release -DKYTY_BUILD_LAUNCHER=OFF ^
            -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl ^
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache ^
            -DKYTY_BUILD_ORIGIN=Source -DKYTY_BUILD_REPOSITORY=${{ github.repository }} ^
            -DKYTY_RELEASE_TAG=Nova-Android-Guest-${{ github.sha }}
      - name: Build full emulator and boot API tests
        shell: cmd
        env:
          SCCACHE_GHA_ENABLED: 'true'
        run: cmake --build pc-build --target kyty_emulator guest_pipe_tests homebrew_boot_api_tests --parallel 4
      - name: Test pipe and resolved guest imports
        shell: cmd
        run: ctest --test-dir pc-build --output-on-failure -R "^(guest_pipe|homebrew_boot_api)$"
      - name: Install and verify CLI
        shell: pwsh
        run: |
          cmake --install pc-build --prefix pc-install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\pc-install\kyty_emulator.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item docs/ANDROID_BOOT_API.md pc-install/README.md
          @{
            project_commit = '${{ github.sha }}';
            kyty_upstream_commit = 'df5b9b92be7dfd463b47756b707d6d356a9f0550';
            api_tests = 'passed'; game_boot_verified = $false;
            decryption_implemented = $false
          } | ConvertTo-Json | Set-Content pc-install/build-info.json
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path pc-install/* -DestinationPath dist/Nova-Android-Guest-Core.zip
          $hash = (Get-FileHash dist/Nova-Android-Guest-Core.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Nova-Android-Guest-Core.zip" | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Nova-Android-Guest-Core-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
