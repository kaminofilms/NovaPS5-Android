name: Nova PS5 Android APK only (reuses a Kyty build)
# Rebuilds just the APK (Java front end, packaging, verification) from the native libraries of an
# earlier android-native run. Logs go to lab-logs (runs/apk-*).
on:
  push:
    branches: [android-apk]
permissions:
  contents: write
  actions: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Kyty build to reuse
        id: kyty
        run: echo "run=$(cat tools/ci/kyty-run-id)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: android-kyty
          path: dist/kyty
          run-id: ${{ steps.kyty.outputs.run }}
          github-token: ${{ github.token }}
      - name: Bundled Turnip (Adreno 8xx, adrenotools build)
        run: |
          set -euo pipefail
          mkdir -p dist/assets/drivers
          curl -fsSL -o dist/assets/drivers/turnip-a8xx.zip \
            https://github.com/The412Banner/Banners-Turnip/releases/download/v26.3.0-20260923/Turnip-v26.3.0-20260923-A8xx.zip
          unzip -l dist/assets/drivers/turnip-a8xx.zip | tee dist/turnip-contents.txt
          unzip -p dist/assets/drivers/turnip-a8xx.zip meta.json
      - name: Build and sign the APK
        run: |
          set -euo pipefail
          python3 build-native-apk.py --sdk "$ANDROID_HOME" --libs dist/kyty/lib --sdl-java dist/kyty/sdl-java --assets dist/assets \
            --keystore tools/ci/novaps5-ci-test.keystore --output "dist/apk/NovaPS5-0.7.1-android-arm64.apk" \
            --version-name 0.7.1-android --version-code 29 2>&1 | tee dist/apk-build.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-apk-build-log
          path: dist/apk-build.txt
      - name: Verify the APK
        run: set -o pipefail; python3 tests/verify_native_apk.py dist/apk/NovaPS5-0.7.1-android-arm64.apk --sdk "$ANDROID_HOME" | tee dist/apk/verify.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/apk
          retention-days: 14
      - name: Publish device test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v0.7.1-android-${GITHUB_SHA::7}"
          cd dist/apk && sha256sum NovaPS5-0.7.1-android-arm64.apk > SHA256SUMS.txt
          gh release create "$tag" NovaPS5-0.7.1-android-arm64.apk SHA256SUMS.txt verify.txt --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease --title "Nova PS5 0.7.1 native Android (CI ${GITHUB_SHA::7}, device test build)" \
            --notes "Native Android build: Kyty + embedded FEXCore in the app process, SDL3/Vulkan/AAudio. No DroidDeck, proot or Linux runtime. Signed with the same key as earlier test builds."
  logs:
    needs: [apk]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Commit logs to lab-logs
        run: |
          set -euo pipefail
          dest="runs/apk-${GITHUB_RUN_ID}-${GITHUB_SHA::8}"
          git init -q logs && cd logs
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin lab-logs; then git checkout -q -b lab-logs FETCH_HEAD; else git checkout -q --orphan lab-logs; fi
          mkdir -p "$dest"
          (cd ../out && find . -type f \( -name '*.txt' -o -name '*.json' \) -size -20M -exec cp --parents {} "../logs/$dest/" \;) || true
          printf '%s apk-only apk=%s\n' "$dest" "${{ needs.apk.result }}" >> INDEX.txt
          git add -A
          git -c user.name=nova-lab -c user.email=nova-lab@users.noreply.github.com commit -qm "apk logs $dest"
          for i in 1 2 3; do git push -q origin HEAD:lab-logs && break; git pull -q --rebase origin lab-logs; done
