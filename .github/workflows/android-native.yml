name: Nova PS5 Android-native (no DroidDeck)
# Owner-authorized 0.9.36 / 86: compact guest loads and translated controller packets, CI gated.
# Kyty and the embedded FEXCore built with the Android NDK; Kyty runs inside the app (SDL3 Android
# backend, Vulkan on the Android surface, AAudio). Logs go to lab-logs (runs/android-*).
on:
  push:
    branches: [android-native, feature/guest-va, feature/anyps5-android-gpu, fix/0923-arm64-ld1-boot, fix/0924-native-guest-hotpaths, fix/0925-agc-commandbuffer-hostviews, fix/0926-shader-cache-persistence, fix/0927-gpu-host-memory, fix/0929-renderer-performance, fix/0931-luna-super-meat-boy, fix/novaps5-0936-luna-watchpoint]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: true
env:
  FEX_COMMIT: 14c92681f4d62cf84d901460e0358de09c8847a7
  KYTY_COMMIT: df5b9b92be7dfd463b47756b707d6d356a9f0550
  ANDROID_API: '33'
jobs:
  novafex:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Watchpoint registry and signature sanitizer tests
        run: |
          python3 tests/test_luna_elf_inspect.py
          g++ -std=c++17 -pthread -Wall -Wextra -Werror -fsanitize=address,undefined tests/test_0936_watchpoint.cpp native/novafex/watchpoint/NovaFexWatchpointBridge.cpp -o /tmp/watchpoint-test
          /tmp/watchpoint-test
          python3 -m py_compile tools/ci/patch-0936-fex-watchpoint.py tools/ci/patch-0936-luna-constructor.py
      - name: Structured SIMD decoder regression tests
        run: |
          python3 tests/test_structured_simd.py
          python3 tests/test_guest_memory.py
          python3 tests/test_host_access_tracking.py
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build ccache python3
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: android-fex-ccache-${{ env.FEX_COMMIT }}-${{ hashFiles('native/**', 'patches/fex-android/**') }}
          restore-keys: android-fex-ccache-${{ env.FEX_COMMIT }}-
      - name: Build libnovafex.so (NDK)
        run: |
          set -o pipefail
          export ANDROID_NDK=$ANDROID_NDK_LATEST_HOME
          bash tools/ci/build-android-novafex.sh "$PWD" "$PWD/work" "$PWD/dist/novafex" 2>&1 | tail -150
      - name: Archive compiled FEX source and dependencies
        run: |
          mkdir -p dist/novafex/source
          tar --exclude='.git' -czf dist/novafex/source/FEX-Android-corresponding-source.tar.gz -C work fex
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-novafex
          path: dist/novafex
          retention-days: 7
  novafex-test:
    needs: novafex
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-novafex
          path: dist/novafex
      - name: Bridge tests (static bionic binary on Linux arm64)
        run: |
          set -o pipefail
          chmod +x dist/novafex/novafex_test_static
          timeout 300s dist/novafex/novafex_test_static 2>&1 | tee dist/novafex/novafex-test-android.txt
          grep -q 'NOVAFEX_TEST: ALL PASS' dist/novafex/novafex-test-android.txt
      - name: Watchpoint scalar stores, faults and typed constructor lifetime
        run: |
          set -o pipefail
          FEX_TSOENABLED=0 NOVA_WATCHPOINT_SCALAR_TEST=1 timeout 300s dist/novafex/novafex_test_static 2>&1 | tee dist/novafex/novafex-test-scalar-android.txt
          grep -q 'NOVAFEX_TEST: ALL PASS' dist/novafex/novafex-test-scalar-android.txt
          NOVA_WATCHPOINT_FAULT_TEST=success timeout 60s dist/novafex/novafex_test_static 2>&1 | tee dist/novafex/novafex-test-success-android.txt
          NOVA_WATCHPOINT_FAULT_TEST=fault timeout 60s dist/novafex/novafex_test_static 2>&1 | tee dist/novafex/novafex-test-fault-android.txt
          NOVA_WATCHPOINT_LUNA_TEST=1 timeout 60s dist/novafex/novafex_test_static 2>&1 | tee dist/novafex/novafex-test-luna-tso-android.txt
          NOVA_WATCHPOINT_LUNA_TEST=1 FEX_TSOENABLED=0 timeout 60s dist/novafex/novafex_test_static 2>&1 | tee dist/novafex/novafex-test-luna-scalar-android.txt
      - name: Cross-slot vector load genuine faults and precise RIP
        run: |
          set -o pipefail
          for tso in 0 1; do
            for mode in unmapped protected; do
              log="dist/novafex/novafex-test-cross-slot-${tso}-${mode}-android.txt"
              NOVA_CROSS_SLOT_FAULT_TEST="$mode" FEX_TSOENABLED="$tso" timeout 120s dist/novafex/novafex_test_static 2>&1 | tee "$log"
              grep -q 'NOVA_CROSS_SLOT_FAULT: PASS' "$log"
              python3 -c 'import re,sys; s=open(sys.argv[1]).read(); expected=re.search(r"NOVA_CROSS_SLOT_EXPECT_RIP: (0x[0-9a-f]+)",s)[1]; actual=re.findall(r"NOVA_FAULT: guest rip=(0x[0-9a-f]+) \(exact\)",s); assert actual and actual[-1] == expected, (expected, actual)' "$log"
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-novafex-test
          path: 'dist/novafex/novafex-test*-android.txt'
  ffmpeg:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: cache
        with:
          path: dist/ffmpeg
          key: android-ffmpeg-n7.1-${{ hashFiles('tools/ci/build-android-ffmpeg.sh') }}
      - name: Build FFmpeg (NDK)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          export ANDROID_NDK=$ANDROID_NDK_LATEST_HOME
          bash tools/ci/build-android-ffmpeg.sh "$PWD/work" "$PWD/dist/ffmpeg"
      - uses: actions/upload-artifact@v4
        with:
          name: android-ffmpeg
          path: dist/ffmpeg
          retention-days: 7
  kyty:
    needs: [novafex, novafex-test, ffmpeg]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build ccache python3 glslang-tools spirv-tools libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers libxxhash-dev
      - uses: actions/download-artifact@v4
        with:
          name: android-novafex
          path: dist/novafex
      - uses: actions/download-artifact@v4
        with:
          name: android-ffmpeg
          path: dist/ffmpeg
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: android-kyty-ccache-${{ env.KYTY_COMMIT }}-${{ github.run_id }}
          restore-keys: android-kyty-ccache-${{ env.KYTY_COMMIT }}-
      - name: Build Kyty for Android (libmain.so + SDL3)
        run: |
          set -o pipefail
          export ANDROID_NDK=$ANDROID_NDK_LATEST_HOME
          bash tools/ci/build-android-kyty.sh "$PWD" "$PWD/work" "$PWD/dist/kyty" "$PWD/dist/novafex" "$PWD/dist/ffmpeg" 2>&1 | tail -200
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ~/.cache/ccache
          key: android-kyty-ccache-${{ env.KYTY_COMMIT }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-kyty
          path: dist/kyty
          retention-days: 7
  apk:
    # Compile/test source-only commits without creating another device APK.
    if: ${{ !contains(github.event.head_commit.message, '[source-only]') }}
    needs: [kyty, novafex-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: android-kyty
          path: dist/kyty
      - uses: actions/download-artifact@v4
        with:
          name: android-novafex
          path: dist/novafex
      - name: Include licenses and corresponding source
        run: |
          mkdir -p dist/assets/licenses dist/apk
          cp LICENSE dist/assets/licenses/Nova-GPL-2.0.txt
          cp LICENSES/* dist/assets/licenses/
          cp docs/ANYPS5-GPU-INTEGRATION.md docs/ANDROID-SHADER-FEATURES-0.9.15.md docs/ANYPS5-COMPUTE-WORKGROUPS-0.9.16.md docs/ANDROID-MESH-DRIVER-0.9.17.md docs/ANDROID-MESH-WAVE32-0.9.18.md docs/ANDROID-MESH-SUBGROUP-0.9.19.md docs/ANDROID-GUEST-MEMORY-0.9.20.md docs/ANDROID-AGC-PACKETS-0.9.21.md docs/ANDROID-NATIVE-PACKETS-0.9.22.md docs/ANDROID-LD1-BOOT-0.9.23.md docs/ANDROID-HOTPATHS-0.9.24.md docs/ANDROID-AGC-HOTPATHS-0.9.25.md docs/ANDROID-PIPELINE-CACHE-0.9.26.md docs/ANDROID-GPU-HOTPATHS-0.9.27.md dist/assets/licenses/
          cp dist/kyty/source/*.tar.gz dist/novafex/source/*.tar.gz dist/apk/
          git archive --format=tar.gz HEAD > dist/apk/NovaPS5-build-source.tar.gz
      - name: Bundled Turnip (Adreno 8xx, adrenotools build)
        run: |
          set -euo pipefail
          mkdir -p dist/assets/drivers
          curl -fsSL -o dist/assets/drivers/turnip-a8xx.zip \
            https://github.com/The412Banner/Banners-Turnip/releases/download/v26.3.0-20261012/Turnip-v26.3.0-20261012-A8xx.zip
          python3 tests/verify_mesh_driver.py dist/assets/drivers/turnip-a8xx.zip
          unzip -l dist/assets/drivers/turnip-a8xx.zip | tee dist/turnip-contents.txt
          unzip -p dist/assets/drivers/turnip-a8xx.zip meta.json
      - name: Build and sign the APK
        run: |
          set -euo pipefail
          python3 build-native-apk.py --sdk "$ANDROID_HOME" --libs dist/kyty/lib --sdl-java dist/kyty/sdl-java --assets dist/assets \
            --keystore tools/ci/novaps5-ci-test.keystore --output "dist/apk/NovaPS5-0.9.36-android-arm64.apk" \
            --version-name 0.9.36-android --version-code 86 2>&1 | tee dist/apk-build.txt
      - name: Verify the APK
        run: set -o pipefail; python3 tests/verify_native_apk.py dist/apk/NovaPS5-0.9.36-android-arm64.apk --sdk "$ANDROID_HOME" --version-name 0.9.36-android --version-code 86 | tee dist/apk/verify.txt
      - name: Verify packaged mesh driver
        run: python3 tests/verify_mesh_driver.py dist/apk/NovaPS5-0.9.36-android-arm64.apk
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-apk-build-log
          path: |
            dist/apk-build.txt
            dist/apk/verify.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/apk
          retention-days: 14
      - name: Publish device test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v0.9.36-android-${GITHUB_SHA::7}"
          cd dist/apk && sha256sum NovaPS5-0.9.36-android-arm64.apk > SHA256SUMS.txt
          gh release create "$tag" NovaPS5-0.9.36-android-arm64.apk SHA256SUMS.txt verify.txt *-source.tar.gz --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease --title "Nova PS5 0.9.36 compact JIT loads and controller output (CI ${GITHUB_SHA::7})" \
            --notes "Native Android Kyty + NovaFEX, versionCode 86. Reduces emitted boundary-load code from sixteen translation copies to one runtime byte loop, retaining original address, byte order, flags, TSO barriers and genuine faults. Publishes controller packets through bounded guest copies to remove repeated native field-store traps. Preserves interrupted native PC/LR when Android stack unwinding stops. Existing constructor watchpoints retained. No renderer/wait bypass, cache clearing, demonstrated loading completion or FPS claim. Target-device validation required."
  logs:
    needs: [novafex, novafex-test, ffmpeg, kyty, apk]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Commit logs to lab-logs
        run: |
          set -euo pipefail
          dest="runs/android-${GITHUB_RUN_ID}-${GITHUB_SHA::8}"
          git init -q logs && cd logs
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin lab-logs; then git checkout -q -b lab-logs FETCH_HEAD; else git checkout -q --orphan lab-logs; fi
          mkdir -p "$dest"
          (cd ../out && find . -type f \( -name '*.txt' -o -name '*.json' -o -name '*.log' \) -size -20M -exec cp --parents {} "../logs/$dest/" \;) || true
          printf '%s android novafex=%s test=%s ffmpeg=%s kyty=%s apk=%s\n' "$dest" "${{ needs.novafex.result }}" "${{ needs.novafex-test.result }}" "${{ needs.ffmpeg.result }}" "${{ needs.kyty.result }}" "${{ needs.apk.result }}" >> INDEX.txt
          git add -A
          git -c user.name=nova-lab -c user.email=nova-lab@users.noreply.github.com commit -qm "android logs $dest"
          for i in 1 2 3; do git push -q origin HEAD:lab-logs && break; git pull -q --rebase origin lab-logs; done







